name: status

# The public status page (w-a06b23 · status/README.md; moved out of the private screenwhere
# monorepo as w-0ff9be — its docs/STATUS-PAGE-PLAN.md holds the design history).
#
# This runs HERE, on GitHub's fleet, and that is the whole design. Caddy, the relay, MediaMTX,
# coturn and the MCP server are five containers on one Hetzner VPS; the failure worth reporting
# takes all five at once, and a prober sitting beside them would go with it. Route D puts both
# the probe and the page somewhere the main VPS cannot reach.
#
# ⚠️ Two things about GitHub's cron, so nobody later reads a gap in the bar as an outage:
#   • it is best-effort — under load a */5 schedule can slip by many minutes;
#   • it is DISABLED automatically after 60 days without repository activity.
# Both are why the page draws missing data grey and labels grey "unknown, not fine", rather
# than letting silence render as health.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["status/**", ".github/workflows/status.yml"]

# One tick at a time. The history branch is force-pushed, so two overlapping runs would race
# and the loser's readings would vanish without a trace.
concurrency:
  group: status
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 🚨 Without this the run reaches "Publish history" and dies on
    # `remote: Write access to repository not granted` — a 403, exit 128. `GITHUB_TOKEN` is
    # READ-ONLY by default, and this job force-pushes the `status-data` branch with it. Declared
    # at job level and nowhere wider: `contents: write` is the only scope this needs, and the
    # token still cannot touch actions, packages, or anything else.
    permissions:
      contents: write
    # ⚠️ NO job-level `env`, and keep it that way. The Cloudflare secrets used to be lifted here,
    # which handed the Pages token to every step of the job — the history fetch, the probe, the
    # history push — beside `contents: write` (F34b, w-4073a5). They were lifted only because a
    # step's `if:` may not read `secrets` (writing one is an invalid workflow FILE that fails in
    # 0 s with no log — w-f862c0). The gate is now status/publish-page.mjs, so the secrets sit in
    # that one step's `env` and no `if:` needs them.
    steps:
      # `persist-credentials: false`: checkout would otherwise leave the write-scoped GITHUB_TOKEN
      # in .git/config for every later step to read — including the third-party publisher. The
      # history fetch is anonymous (the repository is public) and the history push is handed its
      # own token URL in SW_STATUS_PUSH_URL, so nothing needs the stored copy (w-4073a5).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # The npm download cache for the pinned publisher below, keyed on its lockfile.
          cache: npm
          cache-dependency-path: publish/package-lock.json

      # The durable history lives on the orphan branch `status-data`, never on main. At a
      # five-minute cadence a commit per run is 288 commits a day — the branch therefore holds
      # exactly ONE commit, rebuilt from scratch and force-pushed below.
      #
      # 🚨 THIS STEP USED TO BE TWO LINES OF SHELL, AND THEY DELETED NINETY DAYS OF READINGS
      # (w-2e88ec, measured 2026-09-14):
      #
      #   git fetch origin status-data --depth=1 2>/dev/null || echo "no history branch yet"
      #   git show FETCH_HEAD:history.json > status/history.json 2>/dev/null || echo "starting empty"
      #
      # Read as a sentence that says "start empty if there is no history yet". What it does is
      # "start empty if ANYTHING goes wrong", and the publish step then force-pushes that empty
      # store over the real one. On 10 September the store lost 8 and 9 September entirely —
      # 296 successful runs each — and the run that did it was green, because both `2>/dev/null`
      # threw away the evidence and the `>` truncated the destination before git even ran.
      # The script tells "the branch does not exist" (fine, once) from "we could not read it"
      # (exit 1, keep the history), and says which in the log.
      - name: Fetch history
        run: node status/fetch-history.mjs

      - name: Probe
        env:
          # ✅ `SW_STATUS_PAT` is GONE (`w-99ae61`, 2026-09-18). The aggregate rows read the
          # relay's `/status-summary`, which needs no credential — so this step now carries none
          # for them at all. It is removed rather than left harmlessly empty: a secret named in a
          # workflow is a secret somebody will eventually create, and the only one that could
          # have worked here carried its owner's LIVE role into 133 of the relay's routes,
          # sitting in the Actions secrets of a PUBLIC repository.
          # Outage alerting (w-bc5fa5). Optional in exactly the same way: absent, run.mjs still
          # decides and records the transition and prints a ::notice:: saying nothing was sent.
          #
          # 🚨 THE GATE IS IN NODE, NOT IN AN `if:` HERE, and that is not a style choice — a
          # step's `if:` may not read the `secrets` context, and writing one does not produce a
          # false condition but an invalid workflow FILE that fails in 0 s with no log. This
          # workflow shipped that fault once already (w-f862c0); the safest place for a
          # "configured?" test is inside a program that can print why.
          SW_STATUS_DISCORD_WEBHOOK: ${{ secrets.SW_STATUS_DISCORD_WEBHOOK }}
          # Optional ping to ride above the card — `@here`, `<@&roleid>` or a bare user id.
          # An unparseable value adds nothing rather than pasting noise into the channel.
          SW_STATUS_DISCORD_MENTION: ${{ secrets.SW_STATUS_DISCORD_MENTION }}
        run: node status/run.mjs

      # 🚨 A force-push is checked BEFORE it happens, against the branch as it is at that
      # moment — not against the copy this run fetched seconds earlier. The two differ in
      # exactly the case that loses data: another run pushed in between. This repository fires
      # ~296 runs a day against 288 five-minute slots (the Worker cron plus the `schedule`
      # fallback), so overlap is the normal case, not an edge one. The invariant asserted is
      # `lossAgainst` in status/history.mjs: inside the window, a day may not disappear and no
      # counter may go down. A refusal costs one sample, which the page draws grey and labels
      # "unknown, not fine"; the alternative was paid once, and cost ninety days.
      - name: Publish history
        env:
          SW_STATUS_PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: node status/publish-history.mjs

      # The page itself. Cloudflare Pages, because GitHub Pages will not serve a private repo
      # without a paid plan — and because Cloudflare already holds the DNS for the hostname.
      #
      # 🚨 wrangler is PINNED, and installed in a step of its own that holds no secret (F34b,
      # w-4073a5). This used to be `npx --yes wrangler@3`: the whole dependency tree resolved
      # fresh from the registry ~288 times a day, each resolution then run with the Pages token
      # in its environment. Now the tree is publish/package-lock.json, integrity hashes included,
      # and `--ignore-scripts` means no package's install hook runs at all. Bump it deliberately:
      # edit publish/package.json, `npm install --ignore-scripts` there, commit both files.
      - name: Install publisher
        run: npm ci --prefix publish --ignore-scripts --no-audit --no-fund

      # The ONLY step that sees the Cloudflare secrets. Absent either one, the program prints a
      # notice naming which and exits 0 — the history above is already recorded, so the prober
      # works before the hosting exists. Both set, it runs the pinned wrangler and fails with it.
      # The pairing (both required, and a notice for every state that does not publish) is in
      # the program, where status/test-status.mjs runs it, instead of two `if:` lines that had to
      # stay exact complements by hand.
      - name: Publish page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node status/publish-page.mjs
